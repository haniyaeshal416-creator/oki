    color: #F5F7FB;
    background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);

    background-clip: text;
    -webkit-text-fill-color: currentColor;
    text-shadow: 0 2px 20px rgba(255,255,255,0.08);
  }

  /* ---------- fade-in reveal ---------- */
  .fade-in {
    opacity: 0;
    transform: translate(var(--fx, 0px), var(--fy, 30px));
    transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1), transform 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);

  .fade-in.visible {

    transform: translate(0, 0);

  .btn-contact {

    color: #fff;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 0.75rem 2rem;
    font-size: 0.75rem;
    white-space: nowrap;
    background: linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%);
    box-shadow: 0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721B1 inset;
    outline: 2px solid white;
    outline-offset: -3px;
    transition: transform 0.2s ease;
  }
  .btn-contact:hover { transform: scale(1.03); }

  .btn-live {
    border-radius: 999px;
    border: 2px solid var(--paper);

    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;

/* ============================================================
   BUILD DOM
   ============================================================ */
function tripled(arr) { return [...arr, ...arr, ...arr]; }

function buildMarquee() {
  const row1 = document.getElementById('marquee-row-1');
  const row2 = document.getElementById('marquee-row-2');
  tripled(ROW1).forEach(src => {
    const img = document.createElement('img');
    img.src = src; img.loading = 'lazy'; img.alt = '';
    row1.appendChild(img);
  });
  tripled(ROW2).forEach(src => {
    const img = document.createElement('img');
    img.src = src; img.loading = 'lazy'; img.alt = '';
    row2.appendChild(img);
  });
}

function buildAboutText() {
  const p = document.getElementById('about-text');
  const chars = Array.from(ABOUT_TEXT);
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.dataset.index = i;
    p.appendChild(span);
  });
}

function buildServices() {
  const list = document.getElementById('services-list');
  SERVICES.forEach(([num, name, desc], i) => {
    const item = document.createElement('div');
    item.className = 'service-item fade-in';
    item.style.setProperty('--fdelay', (i * 0.1) + 's');
    item.style.setProperty('--fy', '20px');
    item.innerHTML = `
      <span class="service-number">${num}</span>
      <div class="service-body">
        <h3>${name}</h3>
        <p>${desc}</p>
      </div>
    `;
    list.appendChild(item);
  });
}

function buildProjects() {
  const wrap = document.getElementById('cards-wrap');
  PROJECTS.forEach((p, i) => {
    const sticky = document.createElement('div');
    sticky.className = 'project-card-sticky';
    sticky.style.top = (6 * 16 + i * 28) + 'px';
    sticky.innerHTML = `
      <div class="project-card" data-index="${i}">
        <div class="project-top">
          <div class="project-top-left">
            <span class="project-number">${p.number}</span>
            <div class="project-meta">
              <span class="cat">${p.category}</span>
              <span class="name">${p.name}</span>
            </div>
          </div>
          <button class="btn-live">Live Project</button>
        </div>
        <div class="project-grid">
          <div class="project-col1">
            <img src="${p.c1}" alt="${p.name} preview 1" loading="lazy" />
            <img src="${p.c2}" alt="${p.name} preview 2" loading="lazy" />
          </div>
          <div class="project-col2">
            <img src="${p.c3}" alt="${p.name} preview 3" loading="lazy" />
          </div>
        </div>
      </div>
    `;
    wrap.appendChild(sticky);
  });
}

buildMarquee();
buildAboutText();
buildServices();
buildProjects();

/* ============================================================
   FADE-IN ON SCROLL (IntersectionObserver)
   ============================================================ */
const fadeEls = document.querySelectorAll('.fade-in');
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      io.unobserve(entry.target);
    }
  });
}, { threshold: 0, rootMargin: '0px 0px -50px 0px' });
fadeEls.forEach(el => io.observe(el));

/* ============================================================
   MAGNET (mouse-following hero portrait)
   ============================================================ */
(function magnet() {
  const wrap = document.getElementById('magnet-wrap');
  const inner = document.getElementById('magnet-inner');
  const padding = 150;
  const strength = 3;
  window.addEventListener('mousemove', (e) => {
    const rect = wrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const within = e.clientX > rect.left - padding && e.clientX < rect.right + padding &&
                   e.clientY > rect.top - padding && e.clientY < rect.bottom + padding;
    if (within) {
      const ox = (e.clientX - cx) / strength;
      const oy = (e.clientY - cy) / strength;
      inner.style.transition = 'transform 0.3s ease-out';
      inner.style.transform = `translate3d(${ox}px, ${oy}px, 0)`;
    } else {
      inner.style.transition = 'transform 0.6s ease-in-out';
      inner.style.transform = 'translate3d(0,0,0)';
    }
  }, { passive: true });
})();

/* ============================================================
   MARQUEE SCROLL-LINKED TRANSLATE
   ============================================================ */
(function marqueeScroll() {
  const section = document.getElementById('marquee');
  const row1 = document.getElementById('marquee-row-1');
  const row2 = document.getElementById('marquee-row-2');
  function update() {
    const rect = section.getBoundingClientRect();
    const sectionTop = rect.top + window.scrollY;
    const offset = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
    row1.style.transform = `translateX(${offset - 200}px)`;
    row2.style.transform = `translateX(${-(offset - 200)}px)`;
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
})();

/* ============================================================
   ABOUT ANIMATED TEXT (char-by-char scroll reveal)
   ============================================================ */
(function animatedText() {
  const p = document.getElementById('about-text');
  const spans = Array.from(p.children);
  const total = spans.length;

  function progressFor(el) {
    // offset ['start 0.8', 'end 0.2'] equivalent: map paragraph's position
    // through viewport from (top at 80% of viewport) to (bottom at 20% of viewport)
    const rect = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const start = vh * 0.8;
    const end = vh * 0.2;
    const total = start - end;
    const current = start - rect.top;
    return Math.min(1, Math.max(0, current / total));
  }

  function update() {
    const progress = progressFor(p);
    spans.forEach((span, i) => {
      const segStart = i / total;
      const segEnd = segStart + 1 / total;
      let local = (progress - segStart) / (segEnd - segStart);
      local = Math.min(1, Math.max(0, local));
      const opacity = 0.2 + local * 0.8;
      span.style.opacity = opacity;
    });
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();

/* ============================================================
   PROJECTS: STICKY CARD STACK SCALING
   ============================================================ */
(function projectStack() {
  const section = document.getElementById('projects');
  const cards = Array.from(document.querySelectorAll('.project-card'));
  const total = cards.length;

  function update() {
    const rect = section.getBoundingClientRect();
    const sectionTop = rect.top + window.scrollY;
    const sectionHeight = section.offsetHeight;
    const scrollDistance = window.scrollY - sectionTop;
    const progress = Math.min(1, Math.max(0, scrollDistance / (sectionHeight - window.innerHeight)));

    cards.forEach((card, i) => {
      const targetScale = 1 - (total - 1 - i) * 0.03;
      const segStart = i / total;
      let local = (progress - segStart) / (1 - segStart);
      local = Math.min(1, Math.max(0, local));
      const scale = 1 - local * (1 - targetScale);
      card.style.transform = `scale(${scale})`;
    });
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
